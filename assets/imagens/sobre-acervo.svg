  <!-- estudante -->
  <g>
    <circle cx="560" cy="188" r="46" fill="#F7C9A4"/>
    <path d="M514 186 q10-56 56-54 q48 2 44 48 q-8-20-40-24 q-34-4-60 30 Z" fill="#30221A"/>
