    <rect x="80" y="110" width="250" height="92" rx="20" fill="#FFFFFF"/>
    <path d="M130 202 l-6 38 42 -38 Z" fill="#FFFFFF"/>
    <circle cx="126" cy="156" r="22" fill="none" stroke="#0C4DA2" stroke-width="8"/>
    <path d="M142 172 l20 20" stroke="#0C4DA2" stroke-width="10" stroke-linecap="round"/>
    <rect x="172" y="140" width="130" height="12" rx="6" fill="#C9DEF5"/>
