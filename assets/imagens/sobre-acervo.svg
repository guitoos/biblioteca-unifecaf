<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Estudante consultando o acervo digital em um notebook">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1FC"/>
      <stop offset="1" stop-color="#CFE2F7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="0" fill="url(#s-bg)"/>
  <circle cx="650" cy="110" r="130" fill="#0C4DA2" opacity="0.10"/>
  <circle cx="120" cy="520" r="150" fill="#00A9E0" opacity="0.12"/>

  <!-- pilha de livros -->
  <g>
    <rect x="80" y="400" width="190" height="26" rx="8" fill="#0C4DA2"/>
    <rect x="94" y="374" width="162" height="26" rx="8" fill="#00A9E0"/>
    <rect x="72" y="348" width="186" height="26" rx="8" fill="#F2B705"/>
    <rect x="100" y="322" width="150" height="26" rx="8" fill="#072B5E"/>
  </g>

  <!-- mesa -->
  <rect x="40" y="426" width="720" height="18" rx="9" fill="#0C4DA2"/>
  <rect x="100" y="444" width="16" height="96" rx="8" fill="#9CC6F2"/>
  <rect x="684" y="444" width="16" height="96" rx="8" fill="#9CC6F2"/>

  <!-- notebook -->
  <g>
    <path d="M360 426 l34 -168 h212 l34 168 Z" fill="#F4F7FB"/>
    <rect x="372" y="268" width="256" height="150" rx="10" fill="#072B5E"/>
    <rect x="392" y="290" width="216" height="12" rx="6" fill="#00A9E0"/>
    <rect x="392" y="314" width="150" height="10" rx="5" fill="#9CC6F2"/>
    <rect x="392" y="334" width="186" height="10" rx="5" fill="#9CC6F2" opacity="0.7"/>
    <rect x="392" y="354" width="120" height="10" rx="5" fill="#9CC6F2" opacity="0.7"/>
    <rect x="392" y="378" width="96" height="22" rx="11" fill="#F2B705"/>
