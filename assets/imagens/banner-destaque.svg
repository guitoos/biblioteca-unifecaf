<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Faixa ilustrativa com livros abertos e conexoes digitais">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C4DA2"/>
      <stop offset="0.5" stop-color="#0A3D86"/>
      <stop offset="1" stop-color="#072B5E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#b-bg)"/>
  <g opacity="0.18" stroke="#9CC6F2" stroke-width="2" fill="none">
    <path d="M0 440 Q 400 300 800 440 T 1600 440"/>
    <path d="M0 480 Q 400 340 800 480 T 1600 480"/>
    <path d="M0 400 Q 400 260 800 400 T 1600 400"/>
  </g>
  <circle cx="240" cy="120" r="150" fill="#00A9E0" opacity="0.16"/>
  <circle cx="1400" cy="400" r="190" fill="#00A9E0" opacity="0.12"/>

  <!-- livro aberto central -->
  <g transform="translate(800 260)">
    <path d="M-230 70 q115 -58 230 -8 v-150 q-115 -50 -230 8 Z" fill="#F4F7FB"/>
    <path d="M230 70 q-115 -58 -230 -8 v-150 q115 -50 230 8 Z" fill="#E1ECF9"/>
    <path d="M0 -88 v150" stroke="#9CC6F2" stroke-width="6"/>
    <g stroke="#9CC6F2" stroke-width="7" stroke-linecap="round" opacity="0.8">
      <path d="M-200 20 h150"/><path d="M-200 -10 h150"/><path d="M-200 -40 h120"/>
      <path d="M50 20 h150"/><path d="M50 -10 h150"/><path d="M80 -40 h120"/>
    </g>
    <!-- particulas saindo do livro -->
    <g fill="#F2B705">
      <circle cx="-40" cy="-130" r="10"/><circle cx="40" cy="-168" r="7"/><circle cx="-110" cy="-180" r="8"/>
    </g>
    <g fill="#00A9E0">
      <circle cx="110" cy="-140" r="9"/><circle cx="-180" cy="-130" r="6"/><circle cx="170" cy="-190" r="7"/>
    </g>
  </g>

  <!-- icones digitais -->
  <g fill="#F4F7FB" opacity="0.9">
    <rect x="300" y="250" width="150" height="110" rx="12"/>
    <rect x="352" y="360" width="46" height="16"/>
    <rect x="320" y="376" width="110" height="12" rx="6"/>
  </g>
  <g fill="#0C4DA2">
    <rect x="316" y="268" width="118" height="74" rx="6"/>
  </g>
  <g fill="#00A9E0">
    <rect x="330" y="284" width="90" height="8" rx="4"/>
    <rect x="330" y="300" width="64" height="8" rx="4"/>
  </g>

  <g fill="#F4F7FB" opacity="0.9">
    <rect x="1180" y="230" width="96" height="160" rx="16"/>
  </g>
  <rect x="1192" y="252" width="72" height="116" rx="6" fill="#0C4DA2"/>
  <circle cx="1228" cy="380" r="7" fill="#9CC6F2"/>
  <g fill="#F2B705">
    <rect x="1204" y="268" width="48" height="8" rx="4"/>
    <rect x="1204" y="286" width="32" height="8" rx="4"/>
  </g>
</svg>
